<div class="confirm-dialog">
    <h4><span class="glyphicon glyphicon-question-sign"></span> Confirm <span class="confirm-dialog__title">{{$ctrl.title}}</span></h4>
    <p>Are you sure you want to proceed?</p>
    <div style="float: right;">
        <a class="btn btn-danger" ng-click="$ctrl.cancel()">Cancel</a> 
        <a class="btn btn-success" ng-click="$ctrl.yes()">Yes</a>
    </div><div style="clear: both;"></div>    
</div>
